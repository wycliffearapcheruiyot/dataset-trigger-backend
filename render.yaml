services:
  - type: web
    name: dataset-trigger-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATASET_TRIGGER_SECRET
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: dataset_backend
      - key: KAGGLE_USERNAME
        sync: false
      - key: KAGGLE_KEY
        sync: false
      - key: KAGGLE_DATASET
        sync: false
      - key: HF_REPO_ID
        sync: false
      - key: HF_TOKEN
        sync: false
